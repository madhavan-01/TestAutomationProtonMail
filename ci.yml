name: proton-mail-qa-cypress
on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Shared real mailboxes: never run two jobs at once.
concurrency:
  group: proton-test-accounts
  cancel-in-progress: false

env:
  CYPRESS_SENDER_USERNAME: ${{ secrets.SENDER_USERNAME }}
  CYPRESS_SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
  CYPRESS_SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
  CYPRESS_RECEIVER_USERNAME: ${{ secrets.RECEIVER_USERNAME }}
  CYPRESS_RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
  CYPRESS_RECEIVER_PASSWORD: ${{ secrets.RECEIVER_PASSWORD }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint:syntax
      - name: Smoke on PRs, full suite nightly/manual
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then npm run cy:smoke; else npm run cy:run; fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 14
